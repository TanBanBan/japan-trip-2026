<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Japan 2026</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222;background:#f6f5f2}*{box-sizing:border-box}body{margin:0}header{padding:24px 16px 12px;max-width:1050px;margin:auto}h1{margin:0;font-size:28px}header p{margin:6px 0;color:#666}.filters{max-width:1050px;margin:0 auto;padding:4px 16px 8px;display:grid;grid-template-columns:minmax(180px,2fr) repeat(4,minmax(120px,1fr)) auto;gap:8px;align-items:end}.filter-group{display:grid;gap:4px}.filter-group label{font-size:12px;color:#666;font-weight:600}.filter-control{width:100%;min-height:42px;border:1px solid #cfcfcf;border-radius:9px;background:#fff;padding:9px 10px;font:inherit;color:#222}.clear-btn{min-height:42px;border:1px solid #bbb;border-radius:9px;background:#fff;padding:9px 12px;font-weight:600;cursor:pointer}.clear-btn:hover{background:#f2f2f2}.result-count{max-width:1050px;margin:0 auto;padding:2px 16px 4px;font-size:13px;color:#666}.grid{max-width:1050px;margin:auto;padding:12px 16px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:16px}.card h2{margin:0 0 6px;font-size:21px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0 11px}.tag{font-size:12px;background:#f0efeb;padding:4px 8px;border-radius:999px}.desc{line-height:1.45;color:#444;margin:0 0 14px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 12px}.photos:empty{display:none}.photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:9px;background:#eee}.upload-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 13px}.upload-label{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:8px 12px;border:1px solid #bbb;border-radius:9px;background:#fafafa;font-size:14px;font-weight:600;cursor:pointer}.upload-label:hover{background:#f2f2f2}.upload-label.disabled{opacity:.5;cursor:not-allowed}.upload-input{display:none}.image-status{font-size:12px;color:#777}.ratings{display:grid;gap:7px}.rating{display:flex;align-items:center;gap:7px}.who{width:20px;font-weight:700}.stars{display:flex;gap:1px}.star{border:0;background:none;padding:2px;font-size:25px;line-height:1;cursor:pointer;color:#d1d5db;opacity:.35}.rating[data-person="t"] .star.on{color:#e11d48;opacity:1}.rating[data-person="i"] .star.on{color:#2563eb;opacity:1}.rating[data-person="o"] .star.on{color:#16a34a;opacity:1}.star:focus-visible,.upload-label:focus-within,.filter-control:focus-visible,.clear-btn:focus-visible{outline:2px solid #555;outline-offset:2px}.status{font-size:12px;color:#777;min-height:16px}.error{max-width:1050px;margin:10px auto;padding:12px 16px;color:#9b1c1c}.loading{max-width:1050px;margin:auto;padding:20px 16px;color:#666}.empty{max-width:1050px;margin:auto;padding:30px 16px;color:#666;text-align:center}
@media(max-width:800px){.filters{grid-template-columns:1fr 1fr}.filters .search-group{grid-column:1/-1}.clear-btn{width:100%}}
@media(max-width:420px){.filters{grid-template-columns:1fr}.filters .search-group{grid-column:auto}.grid{grid-template-columns:1fr}.photos{gap:5px}.star{font-size:24px}}
.attraction-link{color:#1d4ed8;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}.attraction-link::after{content:" ↗";font-size:.72em;font-weight:700;white-space:nowrap}.attraction-link:hover,.attraction-link:focus{color:#1e40af;text-decoration-thickness:2px}
</style>
</head>
<body>
<header><h1>Japan 2026 🇯🇵</h1><p>Places & experiences · tap a star to change a rating</p></header>
<section class="filters" aria-label="Attraction filters">
  <div class="filter-group search-group"><label for="search">Search</label><input id="search" class="filter-control" type="search" placeholder="Search attraction name…"></div>
  <div class="filter-group"><label for="area-filter">Location</label><select id="area-filter" class="filter-control"><option value="">All locations</option></select></div>
  <div class="filter-group"><label for="category-filter">Type</label><select id="category-filter" class="filter-control"><option value="">All types</option></select></div>
  <div class="filter-group"><label for="traveler-filter">Traveler</label><select id="traveler-filter" class="filter-control"><option value="">Any traveler</option><option value="rating_t">T</option><option value="rating_i">I</option><option value="rating_o">O</option></select></div>
  <div class="filter-group"><label for="rating-filter">Interest</label><select id="rating-filter" class="filter-control"><option value="">Any rating</option><option value="3">3★ or more</option><option value="4">4★ or more</option><option value="5">5★ only</option></select></div>
  <button id="clear-filters" class="clear-btn" type="button">Clear</button>
</section>
<div id="result-count" class="result-count"></div>
<div id="message" class="loading">Loading attractions…</div>
<main id="cards" class="grid"></main>
<script>
const SUPABASE_URL='https://iwmaqyrdfsvpbgedleqs.supabase.co';
const SUPABASE_KEY='sb_publishable_XENRFKX__L4whWb7h5ic_Q_1oA91vzh';
const BUCKET='attraction-images';
const cards=document.getElementById('cards');
const message=document.getElementById('message');
const resultCount=document.getElementById('result-count');
const searchInput=document.getElementById('search');
const areaFilter=document.getElementById('area-filter');
const categoryFilter=document.getElementById('category-filter');
const travelerFilter=document.getElementById('traveler-filter');
const ratingFilter=document.getElementById('rating-filter');
const clearFilters=document.getElementById('clear-filters');
const jsonHeaders={apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'};
let allRows=[];
let imagesByAttraction={};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function googleUrl(r){return 'https://www.google.com/search?q='+encodeURIComponent((r.name||'')+' '+(r.area||'Tokyo')+' Japan')}
function stars(row,field,label){const val=Number(row[field])||0;let s=`<div class="rating" data-person="${label.toLowerCase()}"><span class="who">${label}</span><div class="stars" role="group" aria-label="${label} rating">`;for(let n=1;n<=5;n++)s+=`<button type="button" class="star ${n<=val?'on':''}" data-id="${row.id}" data-field="${field}" data-value="${n}" aria-label="Set ${label} rating to ${n}">★</button>`;return s+'</div></div>'}
function photoHtml(images){return images.map(x=>`<img class="photo" src="${esc(x.image_url)}" alt="Attraction photo" loading="lazy">`).join('')}
function populateSelect(select,values){const current=select.value;select.querySelectorAll('option:not(:first-child)').forEach(o=>o.remove());[...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b)).forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;select.appendChild(o);});if([...select.options].some(o=>o.value===current))select.value=current;}
function filteredRows(){const q=searchInput.value.trim().toLowerCase();const area=areaFilter.value;const category=categoryFilter.value;const traveler=travelerFilter.value;const minRating=Number(ratingFilter.value)||0;return allRows.filter(r=>{if(q&&!String(r.name||'').toLowerCase().includes(q))return false;if(area&&r.area!==area)return false;if(category&&r.category!==category)return false;if(minRating){if(traveler){if((Number(r[traveler])||0)<minRating)return false;}else{const best=Math.max(Number(r.rating_t)||0,Number(r.rating_i)||0,Number(r.rating_o)||0);if(best<minRating)return false;}}return true;});}
function render(){const rows=filteredRows();resultCount.textContent=`${rows.length} of ${allRows.length} attractions`;if(!rows.length){cards.innerHTML='';message.className='empty';message.textContent='No attractions match these filters.';return;}message.textContent='';message.className='';cards.innerHTML=rows.map(r=>{const imgs=imagesByAttraction[r.id]||[];const full=imgs.length>=3;return `<article class="card" data-card="${r.id}">
<h2><a class="attraction-link" href="${googleUrl(r)}" target="_blank" rel="noopener noreferrer">${esc(r.name)}</a></h2>
<div class="meta"><span class="tag">${esc(r.area||'')}</span><span class="tag">${esc(r.category||'')}</span></div>
<div class="photos">${photoHtml(imgs)}</div>
<div class="upload-row"><label class="upload-label ${full?'disabled':''}">${full?'3 images added':'＋ Add image'}<input class="upload-input" type="file" accept="image/*" data-id="${r.id}" ${full?'disabled':''}></label><span class="image-status" aria-live="polite"></span></div>
<p class="desc">${esc(r.description||'')}</p>
<div class="ratings">${stars(r,'rating_t','T')}${stars(r,'rating_i','I')}${stars(r,'rating_o','O')}<div class="status" aria-live="polite"></div></div>
</article>`}).join('');
document.querySelectorAll('.star').forEach(b=>b.addEventListener('click',updateRating));
document.querySelectorAll('.upload-input').forEach(i=>i.addEventListener('change',uploadImage));}
function applyFilters(){render();}
async function load(){try{const [ar,ir]=await Promise.all([
fetch(`${SUPABASE_URL}/rest/v1/attractions?select=*&order=id.asc`,{headers:jsonHeaders}),
fetch(`${SUPABASE_URL}/rest/v1/attraction_images?select=*&order=attraction_id.asc,sort_order.asc`,{headers:jsonHeaders})
]);if(!ar.ok)throw new Error(await ar.text());if(!ir.ok)throw new Error(await ir.text());allRows=await ar.json();const images=await ir.json();imagesByAttraction={};for(const img of images)(imagesByAttraction[img.attraction_id]??=[]).push(img);populateSelect(areaFilter,allRows.map(r=>r.area));populateSelect(categoryFilter,allRows.map(r=>r.category));message.textContent='';message.className='';render();}catch(e){message.className='error';message.textContent='Could not load attractions. '+e.message;}}
async function updateRating(e){const b=e.currentTarget,id=Number(b.dataset.id),field=b.dataset.field,value=Number(b.dataset.value),card=b.closest('.card'),status=card.querySelector('.status');const row=allRows.find(r=>Number(r.id)===id);const previous=row?row[field]:null;if(row)row[field]=value;status.textContent='Saving…';const group=b.parentElement;group.querySelectorAll('.star').forEach(x=>x.classList.toggle('on',Number(x.dataset.value)<=value));try{const r=await fetch(`${SUPABASE_URL}/rest/v1/attractions?id=eq.${encodeURIComponent(id)}`,{method:'PATCH',headers:{...jsonHeaders,Prefer:'return=minimal'},body:JSON.stringify({[field]:value})});if(!r.ok)throw new Error(await r.text());status.textContent='Saved';setTimeout(()=>{if(status.textContent==='Saved')status.textContent=''},1200);if(ratingFilter.value)render();}catch(err){if(row)row[field]=previous;status.textContent='Could not save';render();}}
function loadBitmap(file){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=URL.createObjectURL(file);});}
function canvasBlob(canvas,type,quality){return new Promise(resolve=>canvas.toBlob(resolve,type,quality));}
async function compressImage(file){const img=await loadBitmap(file);let width=img.naturalWidth,height=img.naturalHeight;const maxSide=1400;if(Math.max(width,height)>maxSide){const scale=maxSide/Math.max(width,height);width=Math.round(width*scale);height=Math.round(height*scale);}const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,width,height);URL.revokeObjectURL(img.src);let quality=.76;let blob=await canvasBlob(canvas,'image/webp',quality);while(blob&&blob.size>300000&&quality>.46){quality-=.08;blob=await canvasBlob(canvas,'image/webp',quality);}if(!blob)throw new Error('Could not compress image');return blob;}
async function uploadImage(e){const input=e.currentTarget,file=input.files&&input.files[0];if(!file)return;const card=input.closest('.card'),status=card.querySelector('.image-status'),id=Number(input.dataset.id);input.disabled=true;status.textContent='Compressing…';try{const count=(imagesByAttraction[id]||[]).length;if(count>=3)throw new Error('Maximum 3 images');const blob=await compressImage(file);status.textContent=`Uploading ${Math.max(1,Math.round(blob.size/1024))} KB…`;const path=`${id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.webp`;const upload=await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'image/webp','x-upsert':'false'},body:blob});if(!upload.ok)throw new Error(await upload.text());const publicUrl=`${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`;const row=await fetch(`${SUPABASE_URL}/rest/v1/attraction_images`,{method:'POST',headers:{...jsonHeaders,Prefer:'return=minimal'},body:JSON.stringify({attraction_id:id,image_url:publicUrl,sort_order:count+1})});if(!row.ok)throw new Error(await row.text());(imagesByAttraction[id]??=[]).push({attraction_id:id,image_url:publicUrl,sort_order:count+1});render();}catch(err){status.textContent='Could not add image';input.disabled=false;input.value='';}}
[searchInput,areaFilter,categoryFilter,travelerFilter,ratingFilter].forEach(el=>el.addEventListener(el===searchInput?'input':'change',applyFilters));
clearFilters.addEventListener('click',()=>{searchInput.value='';areaFilter.value='';categoryFilter.value='';travelerFilter.value='';ratingFilter.value='';render();searchInput.focus();});
load();
</script>
</body>
</html>
