ion{min-height:38px;border:1px solid #d6a1a1;border-radius:9px;background:#fff;color:#a22b2b;padding:8px 11px;font-weight:650;cursor:pointer}.delete-attraction:hover{background:#fff4f4}.photos{display:block;margin:0 0 10px}.photos:empty{display:none}.photo-wrap{position:relative;overflow:hidden;border-radius:12px;background:#eee}.photo{width:100%;aspect-ratio:16/9;object-fit:cover;background:#eee;display:block}.delete-photo{position:absolute;top:8px;right:8px;width:34px;height:34px;border:1px solid rgba(255,255,255,.35);border-radius:999px;background:rgba(0,0,0,.62);color:#fff;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px)}.delete-photo:focus-visible{outline:2px solid #fff;outline-offset:2px}.upload-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px}.upload-label{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 13px;border:1px dashed #aaa;border-radius:10px;background:#fafafa;font-size:14px;font-weight:650;cursor:pointer}.upload-label:hover{background:#f2f2f2;border-color:#888}.upload-label.disabled{opacity:.5;cursor:not-allowed}.upload-input{display:none}.image-status{font-size:12px;color:#777}.ratings{display:grid;gap:7px}.rating{display:flex;align-items:center;gap:7px}.who{width:20px;font-weight:700}.stars{display:flex;gap:1px}.star{border:0;background:none;padding:2px;font-size:25px;line-height:1;cursor:pointer;color:#d1d5db;opacity:.35}.rating[data-person="t"] .star.on{color:#e11d48;opacity:1}.rating[data-person="i"] .star.on{color:#2563eb;opacity:1}.rating[data-person="o"] .star.on{color:#16a34a;opacity:1}.star:focus-visible,.upload-label:focus-within,.filter-control:focus-visible,.clear-btn:focus-visible{outline:2px solid #555;outline-offset:2px}.status{font-size:12px;color:#777;min-height:16px}.error{max-width:1050px;margin:10px auto;padding:12px 16px;color:#9b1c1c}.loading{max-width:1050px;margin:auto;padding:20px 16 <body>
<header><div class="header-row"><div><h1>Japan 2026 🇯🇵</h1><p>Places & experiences · tap a star to change a rating</p></div><button id="show-add" class="add-attraction-btn" type="button">＋ Add attraction</button></div></header>
<section class="add-panel" aria-label="Add attraction">
  <form id="add-form" class="add-form" hidden><div class="required-note"><span class="required-mark">*</span> Required</div>
    <h2>Add attraction</h2>
    <div class="form-row"><label for="new-name">Name <span class="required-mark" aria-hidden="true">*</span></label><input id="new-name" class="text-input" type="text" required maxlength="160"></div>
    <div class="form-row"><label for="new-description">Description <span class="required-mark" aria-hidden="true">*</span></label><textarea id="new-description" class="text-area" required maxlength="1200"></textarea></div>
    <div class="form-row"><label for="new-important-note">Important note <span class="optional-note">(optional)</span></label><textarea id="new-important-note" class="text-area" maxlength="600" placeholder="Tickets, registration, date restrictions, etc."></textarea></div>
    <div class="form-row"><span class="tags-label">Tags <span class="required-mark" aria-hidden="true">*</span></span><div id="tag-options" class="tag-options"></div></div>
    <div class="form-row"><span class="tags-label">Ratings <span class="optional-note">(optional)</span></span><div class="add-ratings">
      <div class="add-rating-box"><div class="label">T</div><select id="new-rating-t" class="add-rating-select"><option value="">—</option><option value="1">1★</option><option value="2">2★</option><option value="3">3★</option><option value="4">4★</option><option value="5">5★</option></select></div>
      <div class="add-rating-box"><div class="label">I</div><select id="new-rating-i" class="add-rating-select"><option value="">—</option><option value="1">1★</option><option value="2">2★</option><option value="3">3★</option><option value="4">4★</option><option value="5">5★</option></select></div>
      <div class="add-rating-box"><div class="label">O</div><select id="new-rating-o" class="add-rating-select"><option value="">—</option><option value="1">1★</option><option value="2">2★</option><option value="3">3★</option><option value="4">4★</option><option value="5">5★</option></select></div>
    </div></div>
    <div class="form-row"><label for="new-image">Image <span class="optional-note">(optional)</span></label><div class="add-image-box"><input id="new-image" type="file" accept="image/*"></div></div>
    <div class="form-actions"><button class="save-attraction" type="submit">Add</button><button id="cancel-add" class="cancel-attraction" type="button">Cancel</button></div>
    <div id="add-status" class="form-status" aria-live="polite"></div>
  </form>
</section>
<section class="filters" aria-label="Attraction filters">
  <div class="filter-group search-group"><label for="search">Search</label><input id="search" class="filter-control" type="search" placeholder="Search attraction name…"></div>
  <div class="filter-group"><label for="area-filter">Location</label><select id="area-filter" class="filter-control"><option value="">All locations</option></select></div>
  <div class="filter-group"><label for="category-filter">Type</label><select id="category-filter" class="filter-control"><option value="">All types</option></select></div>
  <div class="filter-group"><label for="traveler-filter">Traveler</label><select id="traveler-filter" class="filter-control"><option value="">Any traveler</option><option value="rating_t">T</option><option value="rating_i">I</option><option value="rating_o">O</option></select></div>
  <div class="filter-group"><label for="rating-filter">Interest</label><select id="rating-filter" class="filter-control"><option value="">Any rating</option><option value="3">3★ or more</option><option value="4">4★ or more</option><option value="5">5★ only</option></select></div>
  <div class="filter-group"><label for="visited-filter">Visited</label><select id="visited-filter" class="filter-control"><option value="unvisited" selected>Not yet visited</option><option value="all">Show all</option></select></div>
  <button id="clear-filters" class="clear-btn" type="button">Clear</button>
</section>
<div id="result-count" class="result-count"></div>
<div id="message" class="loading">Loading attractions…</div>
<main id="cards" class="grid"></main>
<script>
const SUPABASE_URL='https://iwmaqyrdfsvpbgedleqs.supabase.co';
const SUPABASE_KEY='sb_publishable_XENRFKX__L4whWb7h5ic_Q_1oA91vzh';
const BUCKET='attraction-images';
const cards=document.getElementById('cards');
const message=document.getElementById('message');
const resultCount=document.getElementById('result-count');
const searchInput=document.getElementById('search');
const areaFilter=document.getElementById('area-filter');
const categoryFilter=document.getElementById('category-filter');
const travelerFilter=document.getElementById('traveler-filter');
const ratingFilter=document.getElementById('rating-filter');
const visitedFilter=document.getElementById('visited-filter');
const clearFilters=document.getElementById('clear-filters');
const showAdd=document.getElementById('show-add');
const addForm=document.getElementById('add-form');
const cancelAdd=document.getElementById('cancel-add');
const newName=document.getElementById('new-name');
const newDescription=document.getElementById('new-description');
const newImportantNote=document.getElementById('new-important-note');
const newRatingT=document.getElementById('new-rating-t');
const newRatingI=document.getElementById('new-rating-i');
const newRatingO=document.getElementById('new-rating-o');
const newImage=document.getElementById('new-image');
const tagOptions=document.getElementById('tag-options');
const addStatus=document.getElementById('add-status');
const jsonHeaders={apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'};
let allRows=[];
let imagesByAttraction={};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function googleUrl(r){return 'https://www.google.com/search?q='+encodeURIComponent((r.name||'')+' '+(r.area||'Tokyo')+' Japan')}
function rowTags(r){const vals=[];if(r.category)vals.push(r.category);if(Array.isArray(r.tags))vals.push(...r.tags);return [...new Set(vals.filter(Boolean))];}
function allKnownTags(){return [...new Set(allRows.flatMap(rowTags))].sort((a,b)=>a.localeCompare(b));}
function renderTagChoices(){const tags=allKnownTags();tagOptions.innerHTML=tags.map((t,i)=>`<span><input class="tag-check" id="tag-${i}" type="checkbox" value="${esc(t)}"><label class="tag-choice" for="tag-${i}">${esc(t)}</label></span>`).join('');}
function stars(row,field,label){const val=Number(row[field])||0;let s=`<div class="rating" data-person="${label.toLowerCase()}"><span class="who">${label}</span><div class="stars" role="group" aria-label="${label} rating">`;for(let n=1;n<=5;n++)s+=`<button type="button" class="star ${n<=val?'on':''}" data-id="${row.id}" data-field="${field}" data-value="${n}" aria-label="Set ${label} rating to ${n}">★</button>`;return s+'</div></div>'}
function photoHtml(images){return images.map(x=>`<div class="photo-wrap"><img class="photo" src="${esc(x.image_url)}" alt="Attraction photo" loading="lazy"><button type="button" class="delete-photo" data-image-id="${x.id}" data-attraction-id="${x.attraction_id}" data-image-url="${esc(x.image_url)}" aria-label="Delete image">×</button></div>`).join('')}
function populateSelect(select,values){const current=select.value;select.querySelectorAll('option:not(:first-child)').forEach(o=>o.remove());[...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b)).forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;select.appendChild(o);});if([...select.options].some(o=>o.value===current))select.value=current;}
function filteredRows(){const q=searchInput.value.trim().toLowerCase();const area=areaFilter.value;const category=categoryFilter.value;const traveler=travelerFilter.value;const minRating=Number(ratingFilter.value)||0;const visitedMode=visitedFilter.value;return allRows.filter(r=>{if(visitedMode==='unvisited'&&r.visited===true)return false;if(q&&!String(r.name||'').toLowerCase().includes(q))return false;if(area&&r.area!==area)return false;if(category&&!rowTags(r).includes(category))return false;if(minRating){if(traveler){if((Number(r[traveler])||0)<minRating)return false;}else{const best=Math.max(Number(r.rating_t)||0,Number(r.rating_i)||0,Number(r.rating_o)||0);if(best<minRating)return false;}}return true;});}
function render(){const rows=filteredRows();resultCount.textContent=`${rows.length} of ${allRows.length} attractions`;if(!rows.length){cards.innerHTML='';message.className='empty';message.textContent='No attractions match these filters.';return;}message.textContent='';message.className='';cards.innerHTML=rows.map(r=>{const imgs=imagesByAttraction[r.id]||[];const full=imgs.length>=1;return `<article class="card" data-card="${r.id}">
<h2><a class="attraction-link" href="${googleUrl(r)}" target="_blank" rel="noopener noreferrer">${esc(r.name)}</a></h2>
<div class="meta">${r.area?`<span class="tag">${esc(r.area)}</span>`:''}${rowTags(r).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
${r.best_time?`<div class="best-time ${/[0-9]|TBD|Timed|Nov/.test(r.best_time)?'fixed':''}" aria-label="Best time to visit">${esc(r.best_time)}</div>`:''}
<div class="photos">${photoHtml(imgs)}</div>
<div class="upload-row"><label class="upload-label ${full?'disabled':''}">${full?'Image added':'＋ Add image'}<input class="upload-input" type="file" accept="image/*" data-id="${r.id}" ${full?'disabled':''}></label><span class="image-status" aria-live="polite"></span></div>
<p class="desc">${esc(r.description||'')}</p>
${r.important_note?`<p class="important-note">⚠ ${esc(r.important_note)}</p>`:''}
<div class="ratings">${stars(r,'rating_t','T')}${stars(r,'rating_i','I')}${stars(r,'rating_o','O')}<div class="status" aria-live="polite"></div></div>
<div class="card-actions"><label class="visited-toggle"><input class="visited-checkbox" type="checkbox" data-id="${r.id}" ${r.visited===true?'checked':''}><span>Visited</span></label><button type="button" class="delete-attraction" data-attraction-id="${r.id}" data-attraction-name="${esc(r.name)}">Delete attraction</button></div>
</article>`}).join('');
document.querySelectorAll('.star').forEach(b=>b.addEventListener('click',updateRating));
document.querySelectorAll('.upload-input').forEach(i=>i.addEventListener('change',uploadImage));document.querySelectorAll('.visited-checkbox').forEach(i=>i.addEventListener('change',updateVisited));document.querySelectorAll('.delete-photo').forEach(b=>b.addEventListener('click',deleteImage));document.querySelectorAll('.delete-attraction').forEach(b=>b.addEventListener('click',deleteAttraction));}
async function updateVisited(e){const input=e.currentTarget;const id=Number(input.dataset.id);const row=allRows.find(r=>Number(r.id)===id);if(!row)return;const previous=row.visited===true;const next=input.checked;row.visited=next;input.disabled=true;try{const r=await fetch(`${SUPABASE_URL}/rest/v1/attractions?id=eq.${encodeURIComponent(id)}`,{method:'PATCH',headers:{...jsonHeaders,Prefer:'return=minimal'},body:JSON.stringify({visited:next})});if(!r.ok)throw new Error(await r.text());render();}catch(err){row.visited=previous;alert('Could not update visited status.');render();}}
function applyFilters(){render();}
async function load(){try{const [ar,ir]=await Promise.all([
fetch(`${SUPABASE_URL}/rest/v1/attractions?select=*&order=id.asc`,{headers:jsonHeaders}),
fetch(`${SUPABASE_URL}/rest/v1/attraction_images?select=*&order=attraction_id.asc,sort_order.asc`,{headers:jsonHeaders})
]);if(!ar.ok)throw new Error(await ar.text());if(!ir.ok)throw new Error(await ir.text());allRows=await ar.json();const images=await ir.json();imagesByAttraction={};for(const img of images)(imagesByAttraction[img.attraction_id]??=[]).push(img);populateSelect(areaFilter,allRows.map(r=>r.area));populateSelect(categoryFilter,allRows.flatMap(rowTags));renderTagChoices();message.textContent='';message.className='';render();}catch(e){message.className='error';message.textContent='Could not load attractions. '+e.message;}}
async function updateRating(e){const b=e.currentTarget,id=Number(b.dataset.id),field=b.dataset.field,value=Number(b.dataset.value),card=b.closest('.card'),status=card.querySelector('.status');const row=allRows.find(r=>Number(r.id)===id);const previous=row?row[field]:null;if(row)row[field]=value;status.textContent='Saving…';const group=b.parentElement;group.querySelectorAll('.star').forEach(x=>x.classList.toggle('on',Number(x.dataset.value)<=value));try{const r=await fetch(`${SUPABASE_URL}/rest/v1/attractions?id=eq.${encodeURIComponent(id)}`,{method:'PATCH',headers:{...jsonHeaders,Prefer:'return=minimal'},body:JSON.stringify({[field]:value})});if(!r.ok)throw new Error(await r.text());status.textContent='Saved';setTimeout(()=>{if(status.textContent==='Saved')status.textContent=''},1200);if(ratingFilter.value)render();}catch(err){if(row)row[field]=previous;status.textContent='Could not save';render();}}
function loadBitmap(file){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=URL.createObjectURL(file);});}
function canvasBlob(canvas,type,quality){return new Promise(resolve=>canvas.toBlob(resolve,type,quality));}
async function compressImage(file){const img=await loadBitmap(file);let width=img.naturalWidth,height=img.naturalHeight;const maxSide=1400;if(Math.max(width,height)>maxSide){const scale=maxSide/Math.max(width,height);width=Math.round(width*scale);height=Math.round(height*scale);}const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,width,height);URL.revokeObjectURL(img.src);let quality=.76;let blob=await canvasBlob(canvas,'image/webp',quality);while(blob&&blob.size>300000&&quality>.46){quality-=.08;blob=await canvasBlob(canvas,'image/webp',quality);}if(!blob)throw new Error('Could not compress image');return blob;}
async function uploadImage(e){const input=e.currentTarget,file=input.files&&input.files[0];if(!file)return;const card=input.closest('.card'),status=card.querySelector('.image-status'),id=Number(input.dataset.id);input.disabled=true;status.textContent='Compressing…';try{const count=(imagesByAttraction[id]||[]).length;if(count>=1)throw new Error('Only one image allowed');const blob=await compressImage(file);status.textContent=`Uploading ${Math.max(1,Math.round(blob.size/1024))} KB…`;const path=`${id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.webp`;const upload=await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'image/webp','x-upsert':'false'},body:blob});if(!upload.ok)throw new Error(await upload.text());const publicUrl=`${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`;const row=await fetch(`${SUPABASE_URL}/rest/v1/attraction_images`,{method:'POST',headers:{...jsonHeaders,Prefer:'return=minimal'},body:JSON.stringify({attraction_id:id,image_url:publicUrl,sort_order:1})});if(!row.ok)throw new Error(await row.text());(imagesByAttraction[id]??=[]).push({id:null,attraction_id:id,image_url:publicUrl,sort_order:1});await reloadImagesForAttraction(id);render();}catch(err){status.textContent='Could not add image';input.disabled=false;input.value='';}}

async function reloadImagesForAttraction(id){const r=await fetch(`${SUPABASE_URL}/rest/v1/attraction_images?attraction_id=eq.${encodeURIComponent(id)}&select=*&order=sort_order.asc,id.asc`,{headers:jsonHeaders});if(!r.ok)throw new Error(await r.text());imagesByAttraction[id]=await r.json();}
function storagePathFromPublicUrl(url){const marker=`/storage/v1/object/public/${BUCKET}/`;const i=String(url||'').indexOf(marker);return i>=0?String(url).slice(i+marker.length):null;}
async function deleteImage(e){const b=e.currentTarget;const imageId=Number(b.dataset.imageId);const attractionId=Number(b.dataset.attractionId);if(!imageId)return;if(!confirm('Delete this image?'))return;b.disabled=true;try{const path=storagePathFromPublicUrl(b.dataset.imageUrl);const delRow=await fetch(`${SUPABASE_URL}/rest/v1/attraction_images?id=eq.${encodeURIComponent(imageId)}`,{method:'DELETE',headers:{...jsonHeaders,Prefer:'return=minimal'}});if(!delRow.ok)throw new Error(await delRow.text());if(path){await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`,{method:'DELETE',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});}await reloadImagesForAttraction(attractionId);const remaining=imagesByAttraction[attractionId]||[];for(let i=0;i<remaining.length;i++){if(remaining[i].sort_order!==i+1){await fetch(`${SUPABASE_URL}/rest/v1/attraction_images?id=eq.${encodeURIComponent(remaining[i].id)}`,{method:'PATCH',headers:{...jsonHeaders,Prefer:'return=minimal'},body:JSON.stringify({sort_order:i+1})});remaining[i].sort_order=i+1;}}render();}catch(err){alert('Could not delete image.');b.disabled=false;}}

async function deleteAttraction(e){
  const b=e.currentTarget;
  const id=Number(b.dataset.attractionId);
  const name=b.dataset.attractionName||'this attraction';
  if(!confirm(`Delete ${name}? This cannot be undone.`))return;
  b.disabled=true;
  try{
    const imgs=[...(imagesByAttraction[id]||[])];

    // Remove image database rows first. This avoids an image relation ever
    // preventing the attraction itself from being deleted.
    const imageRows=await fetch(`${SUPABASE_URL}/rest/v1/attraction_images?attraction_id=eq.${encodeURIComponent(id)}`,{
      method:'DELETE',
      headers:{...jsonHeaders,Prefer:'return=minimal'}
    });
    if(!imageRows.ok)throw new Error('Image record delete failed: '+await imageRows.text());

    // Delete the attraction next. Storage cleanup is deliberately done only
    // after the database deletion succeeds, so a Storage error cannot block it.
    const r=await fetch(`${SUPABASE_URL}/rest/v1/attractions?id=eq.${encodeURIComponent(id)}`,{
      method:'DELETE',
      headers:{...jsonHeaders,Prefer:'return=minimal'}
    });
    if(!r.ok)throw new Error('Attraction delete failed: '+await r.text());

    // Best-effort cleanup of the actual files in Storage.
    for(const img of imgs){
      const path=storagePathFromPublicUrl(img.image_url);
      if(!path)continue;
      try{
        await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`,{
          method:'DELETE',
          headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}
        });
      }catch(storageErr){
        console.warn('Storage cleanup failed for',path,storageErr);
      }
    }

    allRows=allRows.filter(x=>Number(x.id)!==id);
    delete imagesByAttraction[id];
    populateSelect(areaFilter,allRows.map(r=>r.area));
    populateSelect(categoryFilter,allRows.flatMap(rowTags));
    renderTagChoices();
    render();
  }catch(err){
    console.error(err);
    alert('Could not delete attraction. '+(err&&err.message?err.message:''));
    b.disabled=false;
  }
}

async function addAttraction(e){e.preventDefault();const name=newName.value.trim();const description=newDescription.value.trim();const important_note=newImportantNote.value.trim()||null;const tags=[...tagOptions.querySelectorAll('.tag-check:checked')].map(x=>x.value);const rating_t=newRatingT.value?Number(newRatingT.value):null;const rating_i=newRatingI.value?Number(newRatingI.value):null;const rating_o=newRatingO.value?Number(newRatingO.value):null;const imageFile=newImage.files&&newImage.files[0]?newImage.files[0]:null;if(!name||!description){addStatus.textContent='Name and description are required.';return;}if(!tags.length){addStatus.textContent='Choose at least one tag.';return;}const submit=addForm.querySelector('.save-attraction');submit.disabled=true;addStatus.textContent='Adding…';try{const payload={name,description,tags,important_note,rating_t,rating_i,rating_o};const r=await fetch(`${SUPABASE_URL}/rest/v1/attractions`,{method:'POST',headers:{...jsonHeaders,Prefer:'return=representation'},body:JSON.stringify(payload)});if(!r.ok)throw new Error(await r.text());const created=(await r.json())[0];allRows.push(created);imagesByAttraction[created.id]=[];if(imageFile){addStatus.textContent='Compressing image…';const blob=await compressImage(imageFile);const path=`${created.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.webp`;addStatus.textContent='Uploading image…';const upload=await fetch(`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'image/webp','x-upsert':'false'},body:blob});if(!upload.ok)throw new Error(await upload.text());const publicUrl=`${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`;const imgRow=await fetch(`${SUPABASE_URL}/rest/v1/attraction_images`,{method:'POST',headers:{...jsonHeaders,Prefer:'return=representation'},body:JSON.stringify({attraction_id:created.id,image_url:publicUrl,sort_order:1})});if(!imgRow.ok)throw new Error(await imgRow.text());imagesByAttraction[created.id]=await imgRow.json();}allRows.sort((a,b)=>Number(a.id)-Number(b.id));populateSelect(areaFilter,allRows.map(r=>r.area));populateSelect(categoryFilter,allRows.flatMap(rowTags));renderTagChoices();addForm.reset();addStatus.textContent='Added';render();setTimeout(()=>{addForm.hidden=true;addStatus.textContent='';},500);}catch(err){console.error(err);addStatus.textContent='Could not add attraction.';}finally{submit.disabled=false;}}
showAdd.addEventListener('click',()=>{addForm.hidden=false;renderTagChoices();newName.focus();});
cancelAdd.addEventListener('click',()=>{addForm.reset();addStatus.textContent='';addForm.hidden=true;});
addForm.addEventListener('submit',addAttraction);
[searchInput,areaFilter,categoryFilter,travelerFilter,ratingFilter,visitedFilter].forEach(el=>el.addEventListener(el===searchInput?'input':'change',applyFilters));
clearFilters.addEventListener('click',()=>{searchInput.value='';areaFilter.value='';categoryFilter.value='';travelerFilter.value='';ratingFilter.value='';visitedFilter.value='unvisited';render();searchInput.focus();});
load();
</script>
