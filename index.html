<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Japan 2026</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222;background:#f6f5f2}*{box-sizing:border-box}body{margin:0}header{padding:24px 16px 12px;max-width:1050px;margin:auto}h1{margin:0;font-size:28px}header p{margin:6px 0;color:#666}.grid{max-width:1050px;margin:auto;padding:12px 16px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:16px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0 11px}.tag{font-size:12px;background:#f0efeb;padding:4px 8px;border-radius:999px}.desc{line-height:1.45;color:#444;margin:0 0 14px}.ratings{display:grid;gap:7px}.rating{display:flex;align-items:center;gap:7px}.who{width:20px;font-weight:700}.stars{display:flex;gap:1px}.star{border:0;background:none;padding:2px;font-size:25px;line-height:1;cursor:pointer;color:#d1d5db;opacity:.35}.rating[data-person="t"] .star.on{color:#e11d48;opacity:1}.rating[data-person="i"] .star.on{color:#2563eb;opacity:1}.rating[data-person="o"] .star.on{color:#16a34a;opacity:1}.star:focus-visible{outline:2px solid #555;border-radius:4px}.status{font-size:12px;color:#777;min-height:16px}.error{max-width:1050px;margin:10px auto;padding:12px 16px;color:#9b1c1c}.loading{max-width:1050px;margin:auto;padding:20px 16px;color:#666}
</style>
</head>
<body>
<header><h1>Japan 2026 🇯🇵</h1><p>Places & experiences · tap a star to change a rating</p></header>
<div id="message" class="loading">Loading attractions…</div>
<main id="cards" class="grid"></main>
<script>
const SUPABASE_URL='https://iwmaqyrdfsvpbgedleqs.supabase.co';
const SUPABASE_KEY='sb_publishable_XENRFKX__L4whWb7h5ic_Q_1oA91vzh';
const cards=document.getElementById('cards'); const message=document.getElementById('message');
const headers={apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function stars(row,field,label){const val=row[field];let s=`<div class="rating" data-person="${label.toLowerCase()}"><span class="who">${label}</span><div class="stars" role="group" aria-label="${label} rating">`;for(let n=1;n<=5;n++)s+=`<button type="button" class="star ${n<=val?'on':''}" data-id="${row.id}" data-field="${field}" data-value="${n}" aria-label="Set ${label} rating to ${n}">★</button>`;return s+'</div></div>'}
function render(rows){cards.innerHTML=rows.map(r=>`<article class="card" data-card="${r.id}"><h2>${esc(r.name)}</h2><div class="meta"><span class="tag">${esc(r.area||'')}</span><span class="tag">${esc(r.category||'')}</span></div><p class="desc">${esc(r.description||'')}</p><div class="ratings">${stars(r,'rating_t','T')}${stars(r,'rating_i','I')}${stars(r,'rating_o','O')}<div class="status" aria-live="polite"></div></div></article>`).join('');document.querySelectorAll('.star').forEach(b=>b.addEventListener('click',updateRating));}
async function load(){try{const r=await fetch(`${SUPABASE_URL}/rest/v1/attractions?select=*&order=id.asc`,{headers});if(!r.ok)throw new Error(await r.text());const rows=await r.json();message.remove();render(rows);}catch(e){message.className='error';message.textContent='Could not load attractions. '+e.message;}}
async function updateRating(e){const b=e.currentTarget,id=b.dataset.id,field=b.dataset.field,value=Number(b.dataset.value),card=b.closest('.card'),status=card.querySelector('.status');status.textContent='Saving…';const group=b.parentElement;group.querySelectorAll('.star').forEach(x=>x.classList.toggle('on',Number(x.dataset.value)<=value));try{const r=await fetch(`${SUPABASE_URL}/rest/v1/attractions?id=eq.${encodeURIComponent(id)}`,{method:'PATCH',headers:{...headers,Prefer:'return=minimal'},body:JSON.stringify({[field]:value})});if(!r.ok)throw new Error(await r.text());status.textContent='Saved';setTimeout(()=>{if(status.textContent==='Saved')status.textContent=''},1200);}catch(err){status.textContent='Could not save';await load();}}
load();
</script>
</body>
</html>
